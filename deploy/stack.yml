# deploy/stack.yml
# Version: 1.0.0
# Created: 2026-10-11
#
# Summary:
#   Purpose:
#     Runs this fork from the image deploy/publish.sh builds and pushes.
#     Only ever pulls ghcr.io/braedach/artex — never builds anything
#     itself. See deploy/README.md for the full picture, including what
#     was and wasn't verified before this was written.
#
#   Usage:
#     cp stack.env.example stack.env   # fill in real values first
#     docker compose -f stack.yml --env-file stack.env up -d
#
#     Add --profile testing to also start a throwaway Jellyfin instance on
#     artex-net (no host port published, no real media, empty library) as
#     a second, non-deliberately-vulnerable test target alongside whatever
#     else you point ARTEX at — useful for checking it doesn't manufacture
#     findings against a normal, reasonably-built app:
#       docker compose -f stack.yml --env-file stack.env --profile testing up -d
#     Omit --profile testing for ordinary use; it won't start by default.
#
#   Prerequisites:
#     - stack.env populated (ANTHROPIC_API_KEY, POSTGRES_PASSWORD at
#       minimum) — see stack.env.example
#     - /srv/artex/{postgres,data} exist on the host (and
#       /srv/artex/jellyfin/{config,cache} too if using --profile testing).
#       artex runs as root in its own container (confirmed directly — data
#       it wrote during testing came back root-owned on the host), and the
#       official postgres image's entrypoint chowns its data dir itself on
#       first start regardless of host-side ownership, so a plain root-
#       owned mkdir is enough; Docker will also create these automatically
#       on first `up` if absent, but create them ahead of time instead of
#       letting Docker improvise it:
#         mkdir -p /srv/artex/{postgres,data,jellyfin/config,jellyfin/cache}
#     - ghcr.io/braedach/artex set to Public in GitHub's package settings
#       (defaults private on first push — see publish.sh)
#     - whatever reverse proxy / dashboard labelling convention you use,
#       wired up separately — not done by this file
#
#   Warnings:
#     - ARTEX_LANG=en is set below with a default so the agent's own
#       OUTPUT (findings/reports/chat text) starts in English even if
#       stack.env is incomplete — see server/server.go's precedence chain
#       (runtime DB setting > ARTEX_LANG > config file > "ko", confirmed
#       in this fork's own source). Once someone changes the language
#       from the Settings UI, that runtime setting (stored in Postgres)
#       wins from then on regardless of this default.
#     - This does NOT control the UI chrome's language (menus, buttons,
#       page text) — that's a genuinely separate setting, baked into the
#       static frontend at BUILD time (see deploy/publish.sh's
#       PUBLISH_UI_LOCALE), then overridable per-browser only (cookie/
#       localStorage, resets on a fresh browser/cleared site data).
#       Confirmed the hard way: setting only ARTEX_LANG produced English
#       server logs and agent output with a still-Korean UI, because the
#       image this was running had been built without PUBLISH_UI_LOCALE
#       set, so the static export's baked-in default ("ko") was all any
#       fresh browser ever saw.
#     - No cap_drop/read_only hardening applied yet — this fork's own
#       tooling (nmap in particular) likely needs NET_RAW/NET_ADMIN, and
#       Playwright/Chromium tends to need a writable filesystem. Verify
#       what's actually needed once this is running for real before
#       tightening — don't assume cap_drop: ALL works without testing.
#     - :latest is used deliberately (ARTEX_TAG default) — intended for a
#       development/sandbox deployment, not production; still a manual
#       `docker compose pull && up -d`, never an auto-updater. Pin
#       ARTEX_TAG to a specific version if that stops being true.
#     - All state is bind-mounted under /srv/artex on the host (absolute
#       path, not a relative ./volume/ one — a relative bind mount isn't
#       guaranteed to resolve against a stable, persistent directory under
#       every deployment tool; Dockhand/Compose project working directories
#       in particular aren't something to assume data survival on). Not a
#       named Docker volume either way, so it's visible/backupable as
#       plain files, matching this repo owner's other stacks' convention.
#     - This stack does not add any network-level isolation beyond its
#       own `artex-net` — see deploy/README.md's "what wasn't verified"
#       section before pointing this at anything beyond a local/isolated
#       target.
#
# Changelog:
#   1.2.1 (2026-10-11) - Corrected the ARTEX_LANG comment: it only ever
#     controlled server-side agent output, never the UI chrome — that's
#     a separate, build-time-only setting, fixed in deploy/publish.sh
#     (PUBLISH_UI_LOCALE), not here. No functional change in this file.
#   1.2.0 (2026-10-11) - Moved all bind mounts from relative ./volume/...
#     paths to absolute /srv/artex/... ones, matching every other real
#     stack this repo owner runs (stack-wireshark.yml, stack-vert-dev.yml)
#     and avoiding the relative-path risk a Dockhand-managed deployment
#     doesn't actually need to carry.
#   1.1.1 (2026-10-11) - Dropped the /etc/timezone:/etc/timezone:ro bind
#     mount from artex — found a deploy host where /etc/timezone is a
#     directory, not the plain-text file it's supposed to be (unrelated
#     breakage, not ours to fix, but Docker can't bind a host directory
#     onto a container file path either way: "OCI runtime create failed
#     ... not a directory"). /etc/localtime:ro + the TZ env var already
#     cover timezone correctness without needing this second mount.
#   1.1.0 (2026-10-11) - Added an optional jellyfin service behind the
#     "testing" Compose profile: a second, non-deliberately-vulnerable
#     target to run ARTEX against (unlike Juice Shop, a real app it isn't
#     supposed to find a pile of intentional bugs in) — off by default.
#   1.0.0 (2026-10-11) - Initial dev stack, following a clean smoke test
#     in an isolated lab (see deploy/README.md for what was and wasn't
#     verified before this).

name: stack-artex

services:
  postgres:
    image: postgres:16-alpine
    container_name: artex-postgres
    hostname: artex-postgres
    restart: always
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artex
    volumes:
      - /srv/artex/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - artex-net

  artex:
    image: ghcr.io/braedach/artex:${ARTEX_TAG:-latest}
    container_name: artex
    hostname: artex
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.docker.compose.project=artex
      - com.docker.compose.service=artex
      - homepage.group=Open-Source Intelligence
      - homepage.name=ARTEX
      - homepage.description=Autonomous LLM pentest agent (dev/sandbox use)
      - homepage.icon=artex.png
      # homepage.href intentionally omitted — set it to wherever you
      # actually publish this (see deploy/README.md), it's specific to
      # your own reverse-proxy setup.
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@artex-postgres:5432/artex?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ARTEX_LANG: ${ARTEX_LANG:-en}
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    ports:
      - ${ARTEX_PORT:-8787}:8787
      - ${ARTEX_PROXY_PORT:-8788}:8788
    volumes:
      - /srv/artex/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artex-net

  # Throwaway test target, not a real media server — only starts with
  # --profile testing (see Usage above). No host port published: reachable
  # from artex only, internally, as http://jellyfin:8096. Starts with an
  # empty library (no media mounted in) — it exists for its web UI/API/auth
  # surface, not to serve anything.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: artex-jellyfin
    hostname: jellyfin
    restart: "no"
    profiles:
      - testing
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /srv/artex/jellyfin/config:/config
      - /srv/artex/jellyfin/cache:/cache
    security_opt:
      - no-new-privileges:true
    networks:
      - artex-net

networks:
  artex-net:
    name: artex-net
    driver: bridge
