# deploy/stack-podman.yml
# Version: 1.0.0
# Created: 2026-10-31
#
# Summary:
#   Purpose:
#     Podman PRODUCTION deployment (baden), via Dockhand. The dev/sandbox
#     deployment on claude is deploy/stack-docker.yml — same services, same
#     image, same env wiring, deliberately, so what's tested there is what
#     runs here. Only ever pulls ghcr.io/braedach/artex — never builds
#     anything itself. See deploy/README.md for the full build -> test ->
#     release flow.
#
#   Usage (via Dockhand, baden):
#     - Paste or sync this file as the stack.
#     - Supply stack.env's values as the stack's environment (see
#       stack.env.example). ARTEX_TAG is REQUIRED here (no default) — pin
#       an exact published tag, never :latest, so a test build can't reach
#       production on the next pull (decision 36).
#     - Deploy.
#     Add --profile testing only for a deliberate, time-boxed functional
#     test of ARTEX itself (see the juiceshop service below) — never leave
#     it running here.
#
#   Prerequisites:
#     - /srv/artex/{postgres,data} exist on the host.
#       **Dockhand deploys with Docker Compose even on a Podman host, which
#       silently drops Podman-only volume flags (the ":U" below included) —
#       confirmed for this repo owner's other Podman stacks. Ownership is
#       NOT applied automatically through Dockhand: set it on the host**
#       (artex runs as root in its own container — confirmed directly, data
#       it wrote during testing came back root-owned on the host — and the
#       official postgres image's entrypoint chowns its own data dir on
#       first start regardless of host-side ownership, so a plain root-
#       owned mkdir covers both):
#         mkdir -p /srv/artex/{postgres,data}
#       The ":U" flags are kept in this file anyway for anyone who runs it
#       directly with `podman compose` outside Dockhand, where they do work.
#     - ghcr.io/braedach/artex set to Public in GitHub's package settings
#       (defaults private on first push — see publish.sh)
#     - whatever reverse proxy / dashboard labelling convention you use,
#       wired up separately — not done by this file
#
#   Warnings:
#     - ARTEX_LANG=en is set below with a default so the agent's own OUTPUT
#       (findings/reports/chat text) starts in English even if stack.env is
#       incomplete — see server/server.go's precedence chain (runtime DB
#       setting > ARTEX_LANG > config file > "ko", confirmed in this fork's
#       own source). Once someone changes the language from the Settings
#       UI, that runtime setting (stored in Postgres) wins from then on
#       regardless of this default. This does NOT control the UI chrome's
#       language — that's a separate, build-time-only setting (see
#       deploy/publish.sh's PUBLISH_UI_LOCALE); confirmed the hard way on
#       the dev stack, see stack-docker.yml's changelog.
#     - Self-update is switched off (ARTEX_DISABLE_SELFUPDATE=1): the
#       built-in updater is hard-wired to a third-party repo that no longer
#       resolves, with only a same-release SHA256SUMS as its integrity
#       check. Upgrade by changing ARTEX_TAG and redeploying instead.
#     - No cap_drop/read_only hardening applied to the artex service itself
#       yet — this fork's own tooling (nmap in particular) likely needs
#       NET_RAW/NET_ADMIN, and Playwright/Chromium tends to need a writable
#       filesystem. Verify what's actually needed before tightening.
#     - All state is bind-mounted under /srv/artex on the host (absolute
#       path, not a relative ./volume/ one), matching every other real
#       stack this repo owner runs. Not a named volume either way, so it's
#       visible/backupable as plain files.
#     - This stack does not add any network-level isolation beyond its own
#       `artex-net` — the per-host nftables model (Design-Reference s10) and
#       Dockhand's own containment are what's actually relied on.
#     - **juiceshop below is a deliberately vulnerable scan target, added
#       to THIS production file on the owner's own explicit instruction
#       (31 Oct 2026), which is a deviation from this repo owner's own
#       established convention elsewhere (this fork's sibling, the
#       spiderfoot fork, keeps its equivalent test target dev-only on
#       purpose: "a vulnerable-by-design scan target has no place in
#       production" — see its stack-docker.yml changelog). It is profile-
#       gated (`testing`, off by default) and loopback-published, which
#       limits the exposure to "someone on baden deliberately brings the
#       profile up", not "always running" or "reachable off-host" — but it
#       is still present in the production compose definition where it
#       wasn't before. Revisit whether this should move back to dev-only.**
#
# Changelog:
#   1.0.0 (2026-10-31) - Initial production stack, split out of
#     deploy/stack.yml (now deploy/stack-docker.yml) to match this repo
#     owner's spiderfoot fork's dev/production split. Includes juiceshop —
#     see the Warnings note above.

name: stack-artex

services:
  postgres:
    image: postgres:16-alpine
    container_name: artex-postgres
    hostname: artex-postgres
    restart: always
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artex
    volumes:
      - /srv/artex/postgres:/var/lib/postgresql/data:U
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - artex-net

  artex:
    image: ghcr.io/braedach/artex:${ARTEX_TAG:?ARTEX_TAG must be set to an exact published tag - never :latest in production}
    container_name: artex
    hostname: artex
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.docker.compose.project=artex
      - com.docker.compose.service=artex
      - homepage.group=Open-Source Intelligence
      - homepage.name=ARTEX
      - homepage.description=Autonomous LLM pentest agent
      - homepage.icon=artex.png
      # homepage.href intentionally omitted — set it to wherever you
      # actually publish this, it's specific to your own reverse-proxy
      # setup.
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@artex-postgres:5432/artex?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ARTEX_LANG: ${ARTEX_LANG:-en}
      ARTEX_DISABLE_SELFUPDATE: "1"
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    ports:
      - ${ARTEX_PORT:-8787}:8787
      - ${ARTEX_PROXY_PORT:-8788}:8788
    volumes:
      - /srv/artex/data:/app/data:U
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artex-net

  # Deliberately vulnerable scan target for functional testing of ARTEX
  # itself. See the Warnings note above before enabling this here — it's
  # a deviation from this repo owner's own usual dev/production split.
  # Only starts with --profile testing; never leave it running. Pinned
  # (bump deliberately, not :latest); never publish this beyond loopback.
  # Reachable from artex at http://artex-juiceshop:3000.
  juiceshop:
    image: bkimminich/juice-shop:v20.3.0
    container_name: artex-juiceshop
    hostname: artex-juiceshop
    restart: "no"
    profiles:
      - testing
    ports:
      - 127.0.0.1:${JUICESHOP_PORT:-5003}:3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - artex-net

networks:
  artex-net:
    name: artex-net
    driver: bridge
